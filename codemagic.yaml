workflows:
  android-workflow:
    name: Dhunly Final Success
    instance_type: mac_mini_m2
    scripts:
      - name: Repair and Build
        script: |
          # 1. SDK rasta setup karo
          flutter clean
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          
          # 2. Plugins fresh link karo
          flutter pub get
          
          # 3. Gradlew generate karo
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          cd ..
          
      - name: Build APK
        script: |
          # Sabse safe command
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
