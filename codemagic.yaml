workflows:
  android-workflow:
    name: Dhunly Final Success
    instance_type: mac_mini_m2
    scripts:
      - name: Nuclear Clean
        script: |
          # 1. Sab delete karo jo raste mein aa raha hai
          flutter clean
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          
          # 2. Plugins fresh link karo
          flutter pub get
          
          # 3. Local properties setup
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          
          # 4. Gradlew repair
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          cd ..
          
      - name: Build APK
        script: |
          # Bina dependency validation ke build, taaki wo minor warnings par na ruke
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
