workflows:
  android-workflow:
    name: Dhunly Final Success
    instance_type: mac_mini_m2
    scripts:
      - name: Generate Missing Gradle Files
        script: |
          # SDK path set karo
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          
          # Android folder mein ja kar missing gradlew files banao
          cd android
          flutter pub get
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          cd ..
          
      - name: Build APK
        script: |
          # Ab build chalegi kyunki gradlew ban chuka hai
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
