workflows:
  android-workflow:
    name: Dhunly Final Repair
    instance_type: mac_mini_m2
    scripts:
      - name: Repair and Get Plugins
        script: |
          # 1. Purana sara configuration saaf karo
          flutter clean
          rm -rf .pub-cache
          rm -rf android/.gradle
          
          # 2. Plugins aur Engine ko dobara download karo
          flutter pub get
      - name: Build APK (Force Sync)
        script: |
          # Is baar hum naya build system force karenge
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
