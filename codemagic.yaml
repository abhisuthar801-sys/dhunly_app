workflows:
  android-workflow:
    name: Dhunly Final Fix
    instance_type: mac_mini_m2
    scripts:
      - name: Force Plugin Link
        script: |
          # 1. Purani cache aur generated files saaf karo
          flutter clean
          rm -rf android/.gradle
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          
          # 2. SDK path aur pub get
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          flutter pub get
          
          # 3. Android dependencies download karo
          cd android && ./gradlew clean && cd ..
          
      - name: Build APK
        script: |
          # Is baar bina validation ke full build
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
