workflows:
  android-workflow:
    name: Dhunly Final Success
    instance_type: mac_mini_m2
    scripts:
      - name: Force Plugin Link
        script: |
          # 1. Purana kachra saaf
          flutter clean
          
          # 2. Local properties set karo
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          
          # 3. Plugins fresh download
          flutter pub get
          
      - name: Build APK
        script: |
          # Android folder ke andar ja kar gradle ko permissions do aur build karo
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
