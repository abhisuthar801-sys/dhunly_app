workflows:
  android-workflow:
    name: Dhunly Final Success
    instance_type: mac_mini_m2
    scripts:
      - name: Setup and Repair
        script: |
          # 1. SDK aur Plugins set karo
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          flutter pub get
          
          # 2. Agar gradlew missing hai toh use generate karo
          cd android
          if [ ! -f "gradlew" ]; then
            echo "Gradlew not found, generating..."
            gradle wrapper
          fi
          chmod +x gradlew
          cd ..
          
      - name: Build APK
        script: |
          # Sabse safe tarika build karne ka
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
