workflows:
  android-workflow:
    name: Dhunly Spotify Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Fresh Android Project
        script: |
          flutter create . --platforms android --org com.abhi.dhunly
          # Ye niche wali line Internet Permission add karegi bina file khole
          sed -i '' '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Get Packages
        script: |
          flutter pub get
      - name: Build Debug APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
