workflows:
  android-workflow:
    name: Dhunly Simple Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Fresh Android Project
        script: |
          # Ye command bina kisi error ke naya folder banayegi
          flutter create . --platforms android --org com.abhi.dhunly
      - name: Get Packages
        script: |
          flutter pub get
      - name: Build Debug APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
