workflows:
  android-workflow:
    name: Dhunly Fast Build
    max_build_duration: 15
    instance_type: mac_mini_m2
    scripts:
      - name: Fast Prepare
        script: |
          # Clean ko skip karke dekhte hain agar speed badhe
          flutter pub get
      - name: Build APK (Fast Mode)
        script: |
          # --debug build fast hoti hai
          flutter build apk --debug --no-pub --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
