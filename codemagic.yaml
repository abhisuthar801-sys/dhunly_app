workflows:
  android-workflow:
    name: Dhunly Final Success
    instance_type: mac_mini_m2
    scripts:
      - name: Force Plugin Re-link
        script: |
          # 1. Purana kachra saaf
          flutter clean
          rm -rf android/.gradle
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          
          # 2. Local properties fresh setup
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          
          # 3. Plugins download
          flutter pub get
          
          # 4. Fix gradlew permissions
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          cd ..
          
      - name: Build APK
        script: |
          # Bina dependency check ke seedha build
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
