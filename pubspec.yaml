name: dhunly_app
description: "A professional Spotify-style music streaming app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Music bajane ke liye
  audioplayers: ^5.2.1

  # YouTube se gaane dhoondne aur unka link nikalne ke liye
  youtube_explode_dart: ^2.2.2

  # Internet se data lane ke liye
  http: ^1.1.0

  # App icons ke liye (optional but good)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Agar aap future mein koi photo ya local music file use karna chahen
  # assets:
  #   - assets/images/logo.png
