name: dhunly_pro
description: "A professional Spotify-style YouTube Music Player with Glassmorphism"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Core Music Engine ---
  # Gaane play karne ke liye
  audioplayers: ^5.2.1

  # YouTube se direct audio khinchne ke liye
  youtube_explode_dart: ^2.2.2

  # --- UI & Animations ---
  # Spotify jaisa loading animation
  loading_animation_widget: ^1.2.1
  
  # Premium icons ke liye
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # Material design enable rakhein taaki icons sahi dikhein
  uses-material-design: true

  # Assets ki zarurat nahi hai kyunki hum sab kuch internet/cloud se utha rahe hain
