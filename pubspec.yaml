name: dhunly_pro
description: "A professional Spotify-style YouTube Music Player"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Music & YouTube Packages ---
  audioplayers: ^5.2.1
  youtube_explode_dart: ^2.2.2
  loading_animation_widget: ^1.2.1
  
  # --- UI Icons ---
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Agar aapne koi local images nahi daali hain toh assets section ki zaroorat nahi hai.
  # uses-material-design: true ke niche kuch mat likhna.
