name: dhunly_pro
description: "Dhunly Pro Music App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.1
  http: ^1.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Logo generator tool
  flutter_launcher_icons: "^0.13.1"

# Android Launcher Icon Settings
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  # YAHAN DHYAN DENA: In spaces ko mat chhedna
  assets:
    - assets/logo.png
