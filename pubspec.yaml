name: dhunly_pro
description: "A professional Spotify-style Music Player with Direct Streaming"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Music Engine ---
  # Gaane play karne ke liye sabse best package
  audioplayers: ^5.2.1

  # --- UI & Animations ---
  # Premium Spotify jaisa loading effect
  loading_animation_widget: ^1.2.1
  
  # Icons ke liye
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # Isse icons aur design professional dikhega
  uses-material-design: true
