plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.abhi.dhunly"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.abhi.dhunly"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }
}

dependencies {
    // Ye plugins ko Java ke saath link karne mein madad karega
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    implementation "androidx.annotation:annotation:1.7.0"
}
